name: Build v1-oc + KernelSU-Next Hookless (2)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mido-v1-oc-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: jamet320/android_kernel_xiaomi_mido
          ref: v1-oc
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev python3 rsync unzip \
            ccache device-tree-compiler coccinelle \
            git curl gzip xz-utils
          sudo rm -rf /var/lib/apt/lists/*

      - name: Get Proton Clang commit
        id: proton
        run: |
          set -eux
          REPO="https://github.com/kdrag0n/proton-clang.git"
          COMMIT="$(git ls-remote "$REPO" HEAD | awk '{print $1}')"
          test -n "$COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Proton Clang: $COMMIT"

      - name: Restore Proton Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang-${{ runner.os }}-${{ steps.proton.outputs.commit }}
          restore-keys: |
            proton-clang-${{ runner.os }}-

      - name: Download Proton Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Verify Proton Clang
        run: |
          set -eux
          test -x clang/bin/clang
          clang/bin/clang --version | head -n 3
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Prepare ccache
        run: |
          set -eux
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=sloppiness=file_macro,time_macros
          ccache --show-config

      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-mido-v1-oc-arm64-proton-${{ runner.os }}
          restore-keys: |
            ccache-mido-v1-oc-arm64-proton-

      - name: Integrate KernelSU-Next Legacy
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          test -e drivers/kernelsu
          ls -la drivers/kernelsu

      - name: Apply KernelSU-Next Manual Hooks
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/devnoname120/kernelsu-coccinelle.git /tmp/ksu-cocci
          chmod +x /tmp/ksu-cocci/patch.sh
          /tmp/ksu-cocci/patch.sh
          grep -n "ksu_handle_execveat" fs/exec.c
          grep -n "ksu_handle_faccessat" fs/open.c
          grep -n "ksu_handle_vfs_read" fs/read_write.c
          grep -n "ksu_handle_stat" fs/stat.c

      - name: Configure KernelSU-Next Hookless
        run: |
          set -eux
          DEFCONFIG="arch/arm64/configs/mido_defconfig"
          sed -i -E '/^CONFIG_KSU/d' "$DEFCONFIG"
          printf '\nCONFIG_KSU=y\nCONFIG_KSU_MANUAL_HOOK=y\n' >> "$DEFCONFIG"

      - name: Generate kernel config
        run: |
          set -eux
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CC="ccache clang"
          export HOSTCC="ccache gcc"
          make O=out ARCH="$ARCH" mido_defconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          echo "KSU HOOKLESS OK"

      - name: Build kernel
        run: |
          set -eux
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CC="ccache clang"
          export HOSTCC="ccache gcc"
          make -j"$(nproc)" O=out ARCH="$ARCH" \
            CC="$CC" HOSTCC="$HOSTCC" LLVM=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"

      - name: Create Image.gz-dtb
        run: |
          set -eux
          OUT="$GITHUB_WORKSPACE/out/arch/arm64/boot"
          gzip -n -9 -c "$OUT/Image" > "$OUT/Image.gz"
          DTB="$(find "$OUT/dts" -type f -name '*mido*.dtb' -print | head -n 1)"
          test -n "$DTB"
          cat "$OUT/Image.gz" "$DTB" > "$OUT/Image.gz-dtb"
          ls -lh "$OUT/Image.gz-dtb"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: mido-v1-oc-KernelSU-Next-Hookless-2
          if-no-files-found: error
          compression-level: 0
          path: out/arch/arm64/boot/Image.gz-dtb

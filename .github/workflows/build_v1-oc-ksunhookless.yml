name: Build v1-oc + KernelSU-Next Hookless 2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mido-v1-oc-ksunext
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github
      KBUILD_BUILD_TIMESTAMP: 2026-09-14

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: jamet320/android_kernel_xiaomi_mido
          ref: v1-oc
          fetch-depth: 0

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            python3 \
            rsync \
            unzip \
            ccache \
            device-tree-compiler \
            coccinelle \
            git \
            curl \
            wget \
            zip

      # ============================================================
      # CACHE PROTON CLANG
      # ============================================================
      - name: Cache Proton Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang-mido-${{ runner.os }}-v1-oc
          restore-keys: |
            proton-clang-mido-${{ runner.os }}-

      - name: Download Proton Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang \
            clang

      - name: Setup Proton Clang
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          clang --version
          ld.lld --version

      # ============================================================
      # CACHE CCACHE
      # ============================================================
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-mido-v1-oc-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/mido_defconfig') }}
          restore-keys: |
            ccache-mido-v1-oc-${{ runner.os }}-
            ccache-mido-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true

          ccache --zero-stats || true

          echo "$CCACHE_DIR" >> "$GITHUB_PATH"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          ccache --show-config
          ccache --show-stats

      # ============================================================
      # KERNELSU-NEXT
      # ============================================================
      - name: Integrate KernelSU-Next
        run: |
          echo "=========================================="
          echo "Installing KernelSU-Next"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          echo
          echo "Checking KernelSU-Next integration..."

          test -e drivers/kernelsu
          test -e drivers/KernelSU-Next/kernel

          echo
          echo "drivers/kernelsu:"
          ls -la drivers/kernelsu

          echo
          echo "drivers/Makefile:"
          grep -n "kernelsu" drivers/Makefile || true

          echo
          echo "KernelSU Kconfig:"
          grep -n "KSU" drivers/KernelSU-Next/kernel/Kconfig | head -50 || true

      # ============================================================
      # PREPARE CONFIG
      # ============================================================
      - name: Prepare mido defconfig
        run: |
          echo "=========================================="
          echo "Preparing mido_defconfig"
          echo "=========================================="

          # Make sure KSU is enabled
          sed -i '/^CONFIG_KSU=/d' arch/arm64/configs/mido_defconfig
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/mido_defconfig

          # Remove any existing manual-hook setting
          sed -i '/^CONFIG_KSU_MANUAL_HOOK=/d' arch/arm64/configs/mido_defconfig
          sed -i '/^# CONFIG_KSU_MANUAL_HOOK is not set$/d' arch/arm64/configs/mido_defconfig

          # Explicitly request hookless
          echo '# CONFIG_KSU_MANUAL_HOOK is not set' >> arch/arm64/configs/mido_defconfig

          echo
          echo "Relevant defconfig:"
          grep -E 'CONFIG_KSU|KSU_MANUAL_HOOK' \
            arch/arm64/configs/mido_defconfig || true

      # ============================================================
      # GENERATE CONFIG
      # ============================================================
      - name: Generate kernel config
        run: |
          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            mido_defconfig

      # ============================================================
      # FORCE HOOKLESS
      # ============================================================
      - name: Force KernelSU-Next hookless configuration
        run: |
          echo "=========================================="
          echo "Forcing CONFIG_KSU_MANUAL_HOOK=n"
          echo "=========================================="

          test -x scripts/config

          ./scripts/config \
            --file out/.config \
            -d CONFIG_KSU_MANUAL_HOOK

          # Re-resolve dependencies
          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          echo
          echo "Final KSU configuration:"
          grep -E 'CONFIG_KSU|KSU_MANUAL_HOOK' out/.config || true

      # ============================================================
      # VERIFY HOOKLESS
      # ============================================================
      - name: Verify KernelSU-Next hookless
        run: |
          echo "=========================================="
          echo "Verifying KernelSU-Next"
          echo "=========================================="

          if ! grep -q '^CONFIG_KSU=y$' out/.config; then
            echo "ERROR: CONFIG_KSU is not enabled!"
            exit 1
          fi

          if grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config; then
            echo
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK=y"
            echo "This build is NOT hookless."
            echo
            grep -n -A10 -B10 \
              'CONFIG_KSU_MANUAL_HOOK' \
              drivers/KernelSU-Next/kernel/Kconfig || true
            exit 1
          fi

          if ! grep -q '^# CONFIG_KSU_MANUAL_HOOK is not set$' out/.config; then
            echo
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK is not explicitly disabled."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "KernelSU-Next HOOKLESS: OK"
          echo "=========================================="

          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=' \
            out/.config || true

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build kernel
        run: |
          echo "=========================================="
          echo "Building kernel"
          echo "=========================================="

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC="ccache clang" \
            HOSTCC="ccache gcc" \
            LLVM=1 \
            LLVM_IAS=1

      # ============================================================
      # CHECK BUILD OUTPUT
      # ============================================================
      - name: Check kernel output
        run: |
          echo "=========================================="
          echo "Kernel output"
          echo "=========================================="

          ls -lh out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image

      # ============================================================
      # CREATE IMAGE.GZ
      # ============================================================
      - name: Create Image.gz
        run: |
          cd out/arch/arm64/boot

          gzip -n -9 -c Image > Image.gz

          ls -lh Image
          ls -lh Image.gz

      # ============================================================
      # FIND MIDO DTB
      # ============================================================
      - name: Find mido DTB
        run: |
          echo "=========================================="
          echo "Searching for mido DTB"
          echo "=========================================="

          find out/arch/arm64/boot/dts \
            -type f \
            \( -name '*mido*.dtb' -o -name 'msm8953-qrd-sku3*.dtb' \) \
            -print

          DTB="$(find out/arch/arm64/boot/dts \
            -type f \
            -name '*mido*.dtb' \
            | head -n 1)"

          if [ -z "$DTB" ]; then
            DTB="$(find out/arch/arm64/boot/dts \
              -type f \
              -name 'msm8953-qrd-sku3*.dtb' \
              | head -n 1)"
          fi

          if [ -z "$DTB" ]; then
            echo "ERROR: mido DTB not found!"
            exit 1
          fi

          echo "DTB=$DTB" >> "$GITHUB_ENV"

          echo
          echo "Selected DTB:"
          echo "$DTB"

      # ============================================================
      # CREATE IMAGE.GZ-DTB
      # ============================================================
      - name: Create Image.gz-dtb
        run: |
          echo "=========================================="
          echo "Creating Image.gz-dtb"
          echo "=========================================="

          cat \
            out/arch/arm64/boot/Image.gz \
            "$DTB" \
            > Image.gz-dtb

          ls -lh Image.gz-dtb

          test -s Image.gz-dtb

      # ============================================================
      # SAVE CONFIG
      # ============================================================
      - name: Save final config
        run: |
          cp out/.config mido-final.config

          echo "Final KSU config:"
          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=' \
            mido-final.config || true

      # ============================================================
      # UPLOAD KERNEL
      # ============================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: mido-v1-oc-KernelSU-Next-Hookless
          path: |
            Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image

      # ============================================================
      # UPLOAD CONFIG
      # ============================================================
      - name: Upload final config
        uses: actions/upload-artifact@v4
        with:
          name: mido-v1-oc-final-config
          path: mido-final.config

      # ============================================================
      # CCACHE STATS
      # ============================================================
      - name: ccache statistics
        if: always()
        run: |
          echo "=========================================="
          echo "ccache statistics"
          echo "=========================================="

          ccache --show-stats || true

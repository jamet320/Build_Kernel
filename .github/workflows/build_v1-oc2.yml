name: Build v1-oc + KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: jamet320/android_kernel_xiaomi_mido
          ref: v1-oc
          fetch-depth: 0

      - name: Install apt deps
        run: |
          set -eux

          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            python3 \
            rsync \
            unzip \
            ccache \
            device-tree-compiler \
            coccinelle

            - name: Integrate KernelSU-Next Legacy
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo "=== Downloading and running KernelSU-Next legacy setup ==="
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/legacy/kernel/setup.sh" | bash -

          echo "=== KernelSU-Next integration check ==="
          test -d drivers/kernelsu
          ls -la drivers/kernelsu


      - name: Apply KernelSU-Next manual hooks
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo "=== Cloning semantic patches ==="
          git clone --depth=1 https://github.com/devnoname120/kernelsu-coccinelle.git

          echo "=== Applying scope-minimized manual hooks ==="
          cd kernelsu-coccinelle/scope-minimized-hooks
          ./apply.sh "$GITHUB_WORKSPACE"

          echo "=== Verifying modified files ==="
          cd "$GITHUB_WORKSPACE"
          git diff fs/exec.c fs/open.c fs/read_write.c fs/stat.c | head -n 30 || true

      - name: Download proton-clang
        run: |
          set -eux

          if [ ! -d clang ]; then
            git clone --depth=1 \
              https://github.com/kdrag0n/proton-clang \
              clang
          fi

          echo "=== Proton Clang ==="
          ls -la clang/bin
          clang/bin/clang --version | head -n1

      - name: Prepare ccache
        run: |
          set -eux

          mkdir -p "$CCACHE_DIR"
          ccache --max-size=10G
          ccache --zero-stats

          echo "=== Configure PATH ==="
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

          if [ -d /usr/lib/ccache ]; then
            echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          elif [ -d /usr/lib64/ccache ]; then
            echo "/usr/lib64/ccache" >> "$GITHUB_PATH"
          fi

          echo "=== ccache version ==="
          ccache --version

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ./.ccache
          key: ccache-mido-${{ runner.os }}-clang-${{ github.run_id }}
          restore-keys: |
            ccache-mido-${{ runner.os }}-clang-

      - name: Configure kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/clang/bin:/usr/lib/ccache:$PATH"
          export CC="ccache clang"
          export HOSTCC="ccache gcc"

          echo "=== Inject KernelSU-Next Manual Hook Config ==="
          echo "CONFIG_KSU=y" >> arch/arm64/configs/mido_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/mido_defconfig

          echo "=== Kernel defconfig ==="
          make O=out ARCH=arm64 mido_defconfig

          echo "=== KSU config after defconfig ==="
          grep -E '^(CONFIG_KSU|CONFIG_KSU_)' out/.config || true

      - name: Build kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/clang/bin:/usr/lib/ccache:$PATH"
          export CC="ccache clang"
          export HOSTCC="ccache gcc"

          echo "=== Build kernel ==="
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="$CC" \
            HOSTCC="$HOSTCC" \
            LLVM=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"

      - name: Produce Image.gz-dtb
        run: |
          set -eux

          OUT="$GITHUB_WORKSPACE/out/arch/arm64/boot"

          echo "=== Compress Image ==="
          gzip -n -9 -c "$OUT/Image" > "$OUT/Image.gz"

          echo "=== Find mido DTB ==="
          DTB=$(find "$OUT/dts" -type f -name '*mido*.dtb' | head -n1 || true)

          echo "=== Create Image.gz-dtb ==="
          cat "$OUT/Image.gz" "$DTB" > "$OUT/Image.gz-dtb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mido-Image.gz-dtb-KSU-Next
          path: out/arch/arm64/boot/Image.gz-dtb

name: Build mido kernel perf4.9 + xxksu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: jamet320/kernel_xiaomi_msm8953-4.9
          ref: lineage-17.1
          fetch-depth: 0

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libssl-dev libelf-dev python3 \
            rsync unzip ccache device-tree-compiler

      - name: Download backslashxx KernelSU
        run: |
          set -eux

          git clone --depth=1 \
            https://github.com/backslashxx/KernelSU \
            KernelSU

          echo "=== KernelSU ==="
          ls -la KernelSU
          echo "=== KernelSU kernel ==="
          ls -la KernelSU/kernel

      - name: Integrate backslashxx KernelSU
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo "=== Kernel source ==="
          pwd
          test -d drivers
          test -f Makefile

          echo "=== KernelSU setup ==="
          ./KernelSU/kernel/setup.sh

          echo "=== KernelSU integration check ==="
          test -d drivers/kernelsu
          ls -la drivers/kernelsu

          echo "=== CONFIG_KSU references ==="
          grep -Rni "CONFIG_KSU" drivers/kernelsu | head -20 || true

      - name: Download proton-clang
        run: |
          set -eux

          if [ ! -d clang ]; then
            git clone --depth=1 \
              https://github.com/kdrag0n/proton-clang \
              clang
          fi

          echo "=== Proton Clang ==="
          ls -la clang/bin
          clang/bin/clang --version | head -n1

      - name: Prepare ccache
        run: |
          set -eux

          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"

          mkdir -p "$CCACHE_DIR"

          ccache --max-size=10G

          if [ -d /usr/lib/ccache ]; then
            echo "/usr/lib/ccache"
            echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          elif [ -d /usr/lib64/ccache ]; then
            echo "/usr/lib64/ccache"
            echo "/usr/lib64/ccache" >> "$GITHUB_PATH"
          fi

          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ./.ccache
          key: ccache-mido-${{ runner.os }}-clang
          restore-keys: |
            ccache-mido-${{ runner.os }}-

      - name: Configure kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/clang/bin:/usr/lib/ccache:$PATH"

          export CC="ccache clang"
          export HOSTCC="ccache gcc"

          echo "=== Kernel config ==="

          make O=out \
            ARCH=arm64 \
            mido_defconfig

          echo "=== Check KSU config ==="
          grep -E 'CONFIG_KSU|KSU' out/.config || true

      - name: Build kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/clang/bin:/usr/lib/ccache:$PATH"

          export CC="ccache clang"
          export HOSTCC="ccache gcc"

          echo "=== Build kernel ==="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="$CC" \
            LLVM=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"

      - name: ccache stats
        run: |
          ccache -s || true

      - name: Produce Image.gz-dtb
        run: |
          set -eux

          OUT="$GITHUB_WORKSPACE/out/arch/arm64/boot"

          echo "=== Boot output ==="
          ls -lah "$OUT"

          test -f "$OUT/Image"

          echo "=== Compress Image ==="

          gzip -n -9 -c \
            "$OUT/Image" \
            > "$OUT/Image.gz"

          echo "=== Find mido DTB ==="

          DTB=$(find "$OUT/dts" \
            -type f \
            -name '*mido*.dtb' \
            | head -n1 || true)

          if [ -z "$DTB" ]; then
            echo "DTB not found."
            echo "=== DTS directory ==="
            find "$OUT/dts" -maxdepth 3 -type f | head -100 || true
            exit 1
          fi

          echo "DTB: $DTB"

          echo "=== Create Image.gz-dtb ==="

          cat \
            "$OUT/Image.gz" \
            "$DTB" \
            > "$OUT/Image.gz-dtb"

          echo "=== Final kernel ==="
          ls -lh "$OUT/Image.gz-dtb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mido-Image.gz-dtb-KSU-backslashxx
          path: out/arch/arm64/boot/Image.gz-dtb

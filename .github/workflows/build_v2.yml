name: Build mido kernel v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: jamet320/android_kernel_xiaomi_mido
          ref: lineage-22.2
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            python3 \
            rsync \
            unzip

      - name: Setup clang
        run: |
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang \
            clang

      - name: Build kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out mido_defconfig

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Create Image.gz-dtb
        run: |
          cat \
          out/arch/arm64/boot/Image.gz \
          out/arch/arm64/boot/dts/qcom/msm8953-qrd-sku3-mido.dtb \
          > out/arch/arm64/boot/Image.gz-dtb

      - name: Check output
        run: |
          ls -lh out/arch/arm64/boot/
          ls -lh out/arch/arm64/boot/dts/qcom/

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: mido-Image.gz-dtb
          path: |
            out/arch/arm64/boot/Image.gz-dtb

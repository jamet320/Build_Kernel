name: Build mido kernel v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: jamet320/android_kernel_xiaomi_mido
          ref: lineage-22.2
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            python3 \
            rsync \
            unzip \
            ccache

      - name: Cache proton clang
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang-${{ runner.os }}-latest

      - name: Setup clang
        run: |
          if [ ! -d clang ]; then
            git clone --depth=1 \
              https://github.com/kdrag0n/proton-clang \
              clang
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-mido-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-mido-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=10G
          ccache --set-config compression=true
          ccache -z

      - name: Build kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export CC="ccache clang"

          make O=out mido_defconfig

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC="$CC" \
            LLVM=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: ccache stats
        run: |
          ccache -s

      - name: Create Image.gz-dtb
        run: |
          cat \
          out/arch/arm64/boot/Image.gz \
          out/arch/arm64/boot/dts/qcom/msm8953-qrd-sku3-mido.dtb \
          > out/arch/arm64/boot/Image.gz-dtb

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: mido-Image.gz-dtb
          path: |
            out/arch/arm64/boot/Image.gz-dtb
